name: Validate MEAN services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/setup.js && docker compose config --quiet
      - run: docker build --target gateway -t jugaad-gateway:test .
      - run: docker build --target service -t jugaad-service:test .
